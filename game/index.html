<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1026" />
    <title>Nebula Knights — beyond Super Mario</title>
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- Main menu -->
    <div id="menu" class="overlay">
      <div class="panel">
        <h1>NEBULA<span>KNIGHTS</span></h1>
        <p class="tagline">A cross-platform multiplayer platformer — beyond Super Mario.</p>
        <input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off" />
        <div class="buttons">
          <button id="play-solo" class="primary">▶ Single Player</button>
          <button id="play-coop">🤖 Play vs 3 CPUs</button>
          <button id="play-online">🌐 Online Multiplayer</button>
        </div>
        <ul class="howto">
          <li><b>Move</b> ← → / A D</li>
          <li><b>Jump / Double-jump</b> Space / W / ↑</li>
          <li><b>Dash</b> Shift / L &nbsp; <b>Shoot</b> J / F</li>
          <li>On mobile, use the on-screen buttons.</li>
        </ul>
      </div>
    </div>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div id="scoreboard"></div>
      <div class="topbar">
        <button id="btn-menu">☰ Menu</button>
        <button id="btn-addbot">+ CPU</button>
        <button id="btn-restart">⟳ Restart</button>
        <span id="status"></span>
      </div>
    </div>

    <!-- Touch controls -->
    <div id="touch" class="hidden">
      <div class="dpad">
        <button id="btn-left" class="tbtn">◀</button>
        <button id="btn-right" class="tbtn">▶</button>
      </div>
      <div class="actions">
        <button id="btn-shoot" class="tbtn fire">✷</button>
        <button id="btn-dash" class="tbtn dash">»</button>
        <button id="btn-jump" class="tbtn jump">⤒</button>
      </div>
    </div>

    <!-- Win banner -->
    <div id="banner" class="overlay hidden">
      <div class="panel">
        <h2 class="title">Level Complete!</h2>
        <div class="buttons">
          <button id="banner-restart" class="primary">⟳ Play again</button>
          <button id="banner-menu">☰ Menu</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
