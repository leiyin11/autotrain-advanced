name: Nebula Knights CI

# Build, lint, test and package the game. Scoped to the game/ directory so it is
# independent of the Python project's CI.
on:
  push:
    branches: ['**']
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'

defaults:
  run:
    working-directory: game

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Production build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Test coverage
        run: npm run coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: game/coverage
          if-no-files-found: ignore
